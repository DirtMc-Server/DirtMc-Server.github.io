<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DirtMC — PVP Server</title>

<!-- Modern + pixel-ish combo -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg-1:#07140b;
  --bg-2:#02110a;
  --accent-1:#16a34a; /* green */
  --accent-2:#6ee7b7; /* light green */
  --accent-blue1:#0b63d6;
  --accent-blue2:#7ab8ff;
  --accent-pink1:#b20059;
  --accent-pink2:#ff6fb5;
  --glass: rgba(255,255,255,0.04);
  --text:#e8fff2;
  --card: rgba(5,10,6,0.6);
}

/* reset */
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg-1),var(--bg-2));color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
a{color:inherit;text-decoration:none}

/* canvas bg fills whole screen */
#bgCanvas{position:fixed;inset:0;z-index:0;display:block}

/* layout */
.app{
  position:relative; z-index:5;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
}

/* MAIN CARD */
.card{
  width:min(1024px,96%);
  background: linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.28));
  border-radius:14px;
  padding:22px;
  display:flex; gap:22px; align-items:center;
  box-shadow: 0 30px 80px rgba(0,0,0,0.7);
  border:1px solid rgba(255,255,255,0.03);
}

/* LEFT: logo + title */
.left{
  display:flex; gap:18px; align-items:center;
  min-width:380px;
}
.logoCube{
  width:120px; height:120px; border-radius:6px;
  background: linear-gradient(180deg,#387a2e,var(--accent-1));
  border:6px solid #183d17;
  box-shadow: 0 18px 0 rgba(0,0,0,0.5), 0 0 30px rgba(22,163,74,0.06);
  display:flex; align-items:center; justify-content:center;
  position:relative;
  transform: translateZ(0);
}
.logoCube .bigD{
  font-family:Orbitron, sans-serif;
  font-weight:900;
  font-size:64px;
  color:#04230a;
  text-shadow: 0 6px 0 rgba(0,0,0,0.6);
}
/* title text 3D-ish */
.titleBlock{
  display:flex; flex-direction:column; gap:8px;
}
.title{
  font-family:Orbitron, sans-serif;
  font-weight:900;
  font-size:42px;
  letter-spacing:1px;
  background: linear-gradient(90deg,var(--accent-2),var(--accent-1));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  text-shadow: 0 8px 0 rgba(0,0,0,0.6), 0 0 28px rgba(22,163,74,0.08);
  transform: translateZ(0);
}
.subtitle{
  color:rgba(232,255,242,0.85);
  font-size:14px;
  max-width:420px;
  line-height:1.35;
  opacity:0.95;
}

/* RIGHT: IP and actions */
.right{
  margin-left:auto; display:flex; flex-direction:column; gap:16px; align-items:center; min-width:300px;
}
.ipBox{
  background: linear-gradient(90deg, rgba(0,0,0,0.35), rgba(255,255,255,0.02));
  padding:16px 18px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.04);
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  text-align:center;
  width:100%;
}
.ipRow{ display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
.ipVal{
  font-family:Orbitron, sans-serif;
  font-size:22px;
  font-weight:800;
  padding:8px 12px;
  background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(0,0,0,0.05));
  border-radius:8px;
  min-width:190px;
  text-align:center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}

/* Copy button */
.copyBtn{
  padding:10px 14px;
  border-radius:10px;
  border:0;
  cursor:pointer;
  font-weight:800;
  color:#031205;
  background: linear-gradient(90deg,var(--accent-1),var(--accent-2));
  box-shadow:0 10px 40px rgba(22,163,74,0.08);
  transition: transform .12s ease;
}
.copyBtn:active{ transform: translateY(2px); }

/* Social buttons row */
.socialRow{ display:flex; gap:10px; margin-top:4px; }
.social{
  padding:10px 14px; border-radius:10px; font-weight:700; color:white; border:0; cursor:pointer;
  transition: transform .12s ease, box-shadow .12s ease;
}
.social:active{ transform:translateY(2px) }
.social.discord{ background: linear-gradient(90deg,var(--accent-blue1),var(--accent-blue2)); box-shadow:0 12px 40px rgba(11,99,214,0.08) }
.social.tiktok{ background: linear-gradient(90deg,var(--accent-pink1),var(--accent-pink2)); box-shadow:0 12px 40px rgba(255,111,181,0.08) }

/* sword/pick CSS  - displayed as stylized small SVG inline via CSS positioning for mobile compat */
.swordIcon{
  width:52px;height:52px; display:inline-block; transform:rotate(-18deg); filter:drop-shadow(0 10px 18px rgba(0,0,0,0.6));
}

/* footer small */
.footerSmall{ font-size:12px; color:rgba(232,255,242,0.7); margin-top:6px }

/* responsiveness */
@media (max-width:900px){
  .card{ flex-direction:column; align-items:stretch; padding:18px; gap:16px }
  .left{ min-width:auto; }
  .right{ align-items:stretch; min-width:auto }
  .logoCube{ width:96px;height:96px }
  .logoCube .bigD{ font-size:48px }
  .title{ font-size:32px }
  .ipVal{ font-size:20px }
}

/* Mobile fine-tuning */
@media (max-width:420px){
  .title{ font-size:26px }
  .logoCube{ width:80px;height:80px }
  .logoCube .bigD{ font-size:40px }
  .copyBtn{ font-size:14px; padding:8px 10px }
  .ipVal{ font-size:18px; min-width:150px; padding:6px 8px }
}
</style>
</head>
<body>

<canvas id="bgCanvas" aria-hidden="true"></canvas>

<div class="app">
  <div class="card" role="region" aria-label="DirtMC PVP server landing">
    <div class="left">
      <div class="logoCube" aria-hidden="true">
        <div class="bigD">D</div>
      </div>
      <div class="titleBlock">
        <div class="title">DirtMC</div>
        <div class="subtitle">High-speed PvP | Ranked matches | Custom kits — join, fight, win.</div>
        <div class="footerSmall">Mobile & desktop friendly • Optimized PvP experience</div>
      </div>
    </div>

    <div class="right" role="group" aria-label="server actions">
      <div class="ipBox" aria-hidden="false">
        <div class="ipRow">
          <div class="ipVal">dirtmc.pro</div>
          <div class="ipVal">21411</div>
        </div>
        <div style="margin-top:12px; display:flex; gap:10px; justify-content:center;">
          <button class="copyBtn" id="copyIpBtn" aria-label="Copy IP">Copy IP</button>
        </div>

        <div class="socialRow" style="margin-top:12px;">
          <a class="social discord" href="https://discord.gg/dirtmc" target="_blank" rel="noopener">Discord</a>
          <a class="social tiktok" href="https://vt.tiktok.com/ZSaGx7Yuo/" target="_blank" rel="noopener">TikTok</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- Canvas background: stylized Minecraft-ish blocks, floating swords and modern particles ---------- */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let DPR = Math.max(1, window.devicePixelRatio || 1);

function resize(){
  DPR = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = Math.floor(window.innerWidth * DPR);
  canvas.height = Math.floor(window.innerHeight * DPR);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* helper */
function rand(min,max){ return Math.random()*(max-min)+min }

/* stars/particles */
const stars = [];
function initStars(){
  stars.length=0;
  const count = Math.max(80, Math.floor((window.innerWidth*window.innerHeight)/20000));
  for(let i=0;i<count;i++){
    stars.push({x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight, r:Math.random()*1.6 + 0.3, a: 0.2 + Math.random()*0.9});
  }
}
initStars();
window.addEventListener('resize', initStars);

/* floating swords (stylized) */
const swords = [];
function initSwords(){
  swords.length=0;
  const n = Math.max(3, Math.floor(window.innerWidth/360));
  for(let i=0;i<n;i++){
    swords.push({
      x: Math.random()*window.innerWidth,
      y: Math.random()*window.innerHeight,
      angle: rand(-Math.PI,Math.PI),
      speed: rand(0.2, 0.8),
      rotSpeed: rand(-0.01,0.01),
      scale: rand(0.6,1.2),
      hue: [140,200,320,40][i%4] // color variety
    });
  }
}
initSwords();
window.addEventListener('resize', initSwords);

/* block cubes for background (subtle, layered) */
const cubes = [];
function initCubes(){
  cubes.length=0;
  const count = Math.max(6, Math.floor(window.innerWidth/220));
  for(let i=0;i<count;i++){
    cubes.push({
      x: Math.random()*window.innerWidth,
      y: Math.random()*window.innerHeight,
      size: Math.min(120, 64 + Math.random()*120),
      angle: rand(-0.4,0.4),
      drift: rand(-0.2,0.2),
      depth: Math.random()
    });
  }
}
initCubes();
window.addEventListener('resize', initCubes);

/* draw small stylized sword as path */
function drawSword(ctx,x,y,scale,angle,hue,alpha=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(scale,scale);

  // blade
  ctx.beginPath();
  ctx.moveTo(-6, -24);
  ctx.lineTo(6, -24);
  ctx.lineTo(8, 14);
  ctx.lineTo(-8,14);
  ctx.closePath();
  ctx.fillStyle = `rgba(255,255,255,${0.9*alpha})`;
  ctx.fill();

  // hilt (colored)
  ctx.beginPath();
  ctx.rect(-12,14,24,6);
  ctx.fillStyle = `hsla(${hue},85%,45%,${0.95*alpha})`;
  ctx.fill();

  // handle
  ctx.beginPath();
  ctx.rect(-5,20,10,18);
  ctx.fillStyle = `rgba(40,20,10,${0.95*alpha})`;
  ctx.fill();

  // small highlight on blade
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(2,12);
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.stroke();

  ctx.restore();
}

/* draw cube block (3D pixel cube) */
function drawCube(ctx, x,y, size, angle, depthFactor){
  // simple isometric-ish cube using three faces
  const s = size;
  // front face
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  // shadowed top
  ctx.fillStyle = `rgba(110, 70, 38, ${0.9 - depthFactor*0.4})`;
  ctx.fillRect(-s/2, -s/2 - s*0.2, s, s*0.25);
  // left face
  ctx.fillStyle = `rgba(92,53,28, ${0.95 - depthFactor*0.4})`;
  ctx.fillRect(-s/2, -s/2 + s*0.05, s*0.52, s);
  // right face
  ctx.fillStyle = `rgba(131,77,42, ${0.95 - depthFactor*0.4})`;
  ctx.fillRect(-s/2 + s*0.48, -s/2 + s*0.05, s*0.52, s);
  ctx.restore();
}

/* main draw loop */
let last=0;
function draw(t){
  const dt = t - last;
  last = t;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // backdrop gradient
  const gw = window.innerWidth, gh = window.innerHeight;
  const bg = ctx.createLinearGradient(0,0,0,gh);
  bg.addColorStop(0, '#020705');
  bg.addColorStop(1, '#00120a');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,gw,gh);

  // stars
  for(const s of stars){
    ctx.fillStyle = `rgba(255,255,255,${s.a*0.6})`;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }

  // subtle moving cube field (parallax)
  for(const c of cubes){
    c.x += (Math.sin(t*0.0001 + c.depth*10) * 0.15);
    c.y += (Math.cos(t*0.00007 + c.depth*5) * 0.12);
    drawCube(ctx, c.x, c.y, c.size * (0.6 + c.depth*0.8), c.angle + c.depth*0.02, c.depth);
  }

  // central "arena" subtle glow
  const cx = gw/2, cy = gh/2;
  const arenaR = Math.min(gw,gh) * 0.23;
  const ag = ctx.createRadialGradient(cx,cy, arenaR*0.06, cx,cy, arenaR*1.4);
  ag.addColorStop(0, 'rgba(22,163,74,0.06)');
  ag.addColorStop(0.6, 'rgba(5,8,5,0.02)');
  ag.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = ag;
  ctx.beginPath();
  ctx.arc(cx,cy, arenaR*1.6,0,Math.PI*2);
  ctx.fill();

  // floating swords orbiting around center
  for(let i=0;i<swords.length;i++){
    const s = swords[i];
    // orbit movement
    s.angle += s.rotSpeed * (1 + s.speed*0.02);
    const orbit = arenaR * (1 + (i*0.18));
    // small bobbing
    s.x = cx + Math.cos(s.angle + i*0.6)* (orbit + Math.sin(t*0.0004 + i)*12);
    s.y = cy + Math.sin(s.angle + i*0.6)* (orbit*0.54 + Math.cos(t*0.0003 + i)*8);
    // scale/pulse
    const scale = s.scale * (0.9 + 0.12*Math.sin(t*0.002 + i));
    drawSword(ctx, s.x, s.y, scale, s.angle + 0.6, s.hue, 0.95);
  }

  // center "arena" ring
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(t*0.00008);
  ctx.beginPath();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(22,163,74,0.06)';
  ctx.ellipse(0,0, arenaR*1.05, arenaR*0.6, 0, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();

  // shimmer particles near center
  for(let i=0;i<24;i++){
    const a = (t*0.0006 + i*0.26) % (Math.PI*2);
    const r = arenaR*0.4 + Math.sin(t*0.0012 + i)* (arenaR*0.12);
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r*0.6;
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${0.06 + 0.4*Math.abs(Math.sin(t*0.001 + i))})`;
    ctx.arc(x,y, 1.2 + Math.abs(Math.sin(t*0.001 + i))*1.4, 0, Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------- Button actions: copy IP + click tone ---------- */
const copyBtn = document.getElementById('copyIpBtn');
copyBtn.addEventListener('click', async ()=>{
  try{
    await navigator.clipboard.writeText('dirtmc.pro:21411');
    const old = copyBtn.textContent;
    copyBtn.textContent = 'Copied ✔';
    playClickTone();
    setTimeout(()=> copyBtn.textContent = old, 1400);
  }catch(e){
    alert('Copy failed — try manually');
  }
});

/* small click tone using WebAudio */
let audioCtx;
function playClickTone(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = 660;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    // ramp up then down quickly
    g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);
    o.stop(audioCtx.currentTime + 0.22);
  }catch(e){}
}

/* init/resets on resize */
window.addEventListener('resize', ()=>{
  initStars();
  initSwords();
  initCubes();
});

/* initialize arrays on load */
initStars();
initSwords();
initCubes();

/* optional: small performance tweak - reduce elements on small screens */
(function adaptForMobile(){
  if(window.innerWidth < 520){
    // reduce swords and cubes
    while(swords.length>2) swords.pop();
    while(cubes.length>4) cubes.pop();
  }
})();
</script>
</body>
</html>
