<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DirtMc</title>

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  color:white;
  overflow:hidden;
  background:url("background.png") center/cover no-repeat;
}

/* النجوم */

.stars span{
  position:absolute;
  width:3px;
  height:3px;
  background:#00ffcc;
  border-radius:50%;
  box-shadow:0 0 8px #00ffcc;
  animation: floatStar linear infinite;
}

@keyframes floatStar{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

/* الصندوق الرئيسي */

.center-box{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:40px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 25px #00ff88;
  width:90%;
  max-width:400px;
}

.server-name{
  font-size:28px;
  margin-bottom:20px;
  text-shadow:0 0 15px #00ff88;
}

/* مربع الايبي */

.ip-box{
  padding:15px;
  border-radius:15px;
  background:rgba(0,0,0,0.5);
  box-shadow:0 0 15px #00ff88;
  cursor:pointer;
  font-size:20px;
  margin-bottom:15px;
  transition:0.3s;
}

.ip-box:hover{
  transform:scale(1.05);
}

/* ازرار */

.btn{
  display:block;
  margin:10px auto;
  padding:12px;
  border-radius:15px;
  text-decoration:none;
  color:white;
  font-weight:bold;
  box-shadow:0 0 15px #00ff88;
  width:80%;
  transition:0.3s;
}

.discord{
  background:linear-gradient(45deg,#5865F2,#8ea1ff);
}

.tiktok{
  background:linear-gradient(45deg,#ff0050,#00f2ea);
}

.btn:hover{
  transform:scale(1.05);
}

/* احصائيات الدس */

.discord-stats{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
}

.stat-box{
  background:rgba(0,0,0,0.5);
  padding:12px;
  border-radius:15px;
  box-shadow:0 0 15px #00ff88;
  min-width:100px;
}

.stat-box h3{
  margin:0;
  font-size:24px;
  color:#00ff88;
}

.stat-box p{
  margin:0;
  font-size:12px;
}

</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="center-box">

  <div class="server-name">DirtMc</div>

  <div class="ip-box" onclick="copyIP()">
    DirtMc.pro:21411
  </div>

  <div class="discord-stats">
    <div class="stat-box">
      <h3 id="onlineCount">0</h3>
      <p>Online</p>
    </div>

    <div class="stat-box">
      <h3 id="memberCount">0</h3>
      <p>Members</p>
    </div>
  </div>

  <a class="btn discord" href="https://discord.gg/dirtmc" target="_blank">
    Discord
  </a>

  <a class="btn tiktok" href="https://vt.tiktok.com/ZSaGx7Yuo/" target="_blank">
    TikTok
  </a>

</div>

<script>

/* نسخ الايبي */

function copyIP(){
  navigator.clipboard.writeText("DirtMc.pro:21411");
  alert("Copy Done ⭐");
}

/* نجوم الخلفية */

const starContainer = document.getElementById("stars");

for(let i=0;i<40;i++){
  let star=document.createElement("span");
  star.style.left=Math.random()*100+"vw";
  star.style.animationDuration=(5+Math.random()*5)+"s";
  starContainer.appendChild(star);
}

/* جلب احصائيات الديسكورد */

/* 🔥 حط Server ID هنا بدل YOUR_SERVER_ID */

fetch("https://discord.com/api/guilds/YOUR_SERVER_ID/widget.json")
.then(res=>res.json())
.then(data=>{
  document.getElementById("onlineCount").textContent=data.presence_count;
  document.getElementById("memberCount").textContent=data.members.length;
});

</script>

</body>
</html>
