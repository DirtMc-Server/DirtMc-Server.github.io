<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DirtMC — Copy IP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --accent-1: #16a34a;
  --accent-2: #6ee7b7;
  --bg-dark: #06120b;
  --text: #e9fff0;
  --bg-img: url('background.png');
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui;background:var(--bg-dark);color:var(--text);overflow:hidden}
a{text-decoration:none;color:inherit}

/* background */
.bg-image{
  position:fixed; inset:0; z-index:0;
  background:var(--bg-img) center/cover no-repeat;
  filter:brightness(.42);
}

/* stars */
#starCanvas{position:fixed; inset:0; z-index:1; pointer-events:none}

/* 🎮 GAME BUTTON */
.game-btn{
  position:fixed;
  top:16px;
  right:16px;
  z-index:10;
  padding:12px 20px;
  font-weight:900;
  font-size:15px;
  border-radius:14px;
  background:linear-gradient(135deg,#22c55e,#86efac);
  color:#022c1a;
  box-shadow:0 12px 40px rgba(34,197,94,.35);
  transition:.2s ease;
}
.game-btn:hover{transform:scale(1.06)}
.game-btn:active{transform:scale(.96)}

/* main */
.container{
  position:relative; z-index:5;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card-wrap{
  width:min(920px,96%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}
.site-title{
  font-weight:900;
  font-size:30px;
  color:var(--accent-2);
  text-shadow:0 0 20px rgba(110,231,183,.4);
}

/* center box */
.centerBox{
  width:100%;
  max-width:760px;
  padding:28px;
  border-radius:16px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
  box-shadow:0 30px 90px rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}

/* ip */
.ipBox{
  width:100%;
  padding:22px;
  border-radius:12px;
  background:rgba(255,255,255,.04);
  border:2px solid rgba(255,255,255,.06);
  cursor:pointer;
}
.ipText{
  font-size:26px;
  font-weight:900;
  text-align:center;
}

/* copy label */
.copyLabel{
  font-size:13px;
  font-weight:800;
  color:var(--accent-2);
  opacity:0;
  transition:.3s;
}

/* buttons */
.btnRow{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}
.btn{
  padding:12px 18px;
  border-radius:12px;
  border:0;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}
.btnDiscord{
  background:linear-gradient(135deg,#5865F2,#9aa5ff);
  color:white;
}
.btnTiktok{
  background:linear-gradient(135deg,#ff0050,#00f2ea);
  color:white;
}
.btn:hover{transform:scale(1.05)}

@media(max-width:640px){
  .ipText{font-size:20px}
  .site-title{font-size:22px}
  .game-btn{font-size:14px;padding:10px 16px}
}
</style>
</head>

<body>

<div class="bg-image"></div>
<canvas id="starCanvas"></canvas>

<!-- 🎮 GAME BUTTON -->
<a class="game-btn" href="https://dirtmc-server.github.io/game.github.io" target="_blank">
  🎮 DirtMc Game
</a>

<div class="container">
  <div class="card-wrap">
    <div class="site-title">DirtMc</div>

    <div class="centerBox">
      <div class="ipBox" id="ipBox">
        <div class="ipText" id="ipText">DirtMc.pro:21411</div>
      </div>

      <div class="copyLabel" id="copyLabel">Copy done ⭐</div>

      <div class="btnRow">
        <button class="btn btnDiscord" id="discordBtn">Discord</button>
        <button class="btn btnTiktok" id="tiktokBtn">TikTok</button>
      </div>
    </div>
  </div>
</div>

<script>
/* stars */
const c=document.getElementById("starCanvas"),x=c.getContext("2d");
function r(){c.width=innerWidth;c.height=innerHeight}
r();addEventListener("resize",r);
let s=[...Array(70)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+1}));
(function a(){
  x.clearRect(0,0,c.width,c.height);
  s.forEach(o=>{
    o.y-=.15;if(o.y<0)o.y=innerHeight;
    x.beginPath();
    x.fillStyle="rgba(110,255,170,.8)";
    x.arc(o.x,o.y,o.r,0,7);x.fill();
  });
  requestAnimationFrame(a);
})();

/* copy */
const ipBox=document.getElementById("ipBox");
const copyLabel=document.getElementById("copyLabel");
ipBox.onclick=async()=>{
  await navigator.clipboard.writeText("DirtMc.pro:21411");
  copyLabel.style.opacity=1;
  setTimeout(()=>copyLabel.style.opacity=0,1200);
};

/* links */
document.getElementById("discordBtn").onclick=()=>open("https://discord.gg/dirtmc","_blank");
document.getElementById("tiktokBtn").onclick=()=>open("https://vt.tiktok.com/ZSaGx7Yuo/","_blank");
</script>

</body>
</html>
